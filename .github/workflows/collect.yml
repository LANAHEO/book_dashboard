name: 순위 수집

# 이 파일의 제1 규칙: 순환은 제 수명이 다할 때까지 멈추지 않는다.
#
# 수집이 끊긴 사고가 네 번 있었고, 네 번 다 원인이 "검사가 수집을 멈춘 것"이었다.
# 기준 시각 5분 규칙, 묵음 판정, 서점의 일시적 응답, 알라딘 주간이 하루 중에
# 움직이는 것 — 네 번 다 우리 순위는 맞았는데 수집만 몇 시간씩 비었다. 멈추는
# 조건을 하나씩 좁혀 봤지만 그때마다 예상 못 한 다음 조건이 나왔다.
#
# 그래서 조건을 좁히는 대신 권한을 없앤다. 루프 안에는 exit 가 없다. 문제는
# 전부 변수에 모아 두었다가 순환이 끝난 뒤에 한 번에 내고, 실행만 빨개진다.
# 수집은 그동안에도 계속 돈다.
#
# 이 규칙을 되돌리려거든, 순위가 틀린 것과 수집이 멈춘 것 중 어느 쪽이 더
# 나쁜지부터 정하라. 틀린 순위는 화면에 보이고 다음 수집에서 고쳐진다.
# 멈춘 수집은 아무도 모르는 채로 화면을 굳힌다.

# 수집은 이 러너 안에서 직접 한다(scripts/collector.js). 예전에는 Vercel 의
# /api/collect 를 불러 Vercel 이 서점을 돌았는데, 그게 Vercel 무료 한도(Active CPU
# 4시간)를 다 써서 2026-11-06 배포가 통째로 멈췄다. 이 리포는 공개라 Actions
# 실행 시간이 무료다.
#
# 단 알라딘은 해외에서 오는 접속을 막아 이 러너(미국)에서는 받아지지 않는다.
# 그래서 여기서는 교보·예스24 만 직접 모으고, 알라딘은 회차마다 서울에 있는 Vercel 에게
# 받아 달라고 한다(/api/collect-rows). 화면이 읽는 스냅샷은 여기서만 만든다
# (server.js "누가 어느 서점을 모으는가").
#
# 그런데 GitHub 무료 예약은 적어 둔 시각을 지키지 않는다. `*/15`(하루 96회)로 두고
# 11일치 실행 기록을 세어 보니 실제로는 하루 9.7회, 실행 간격 중앙값 133분,
# 최악 471분이었다. 예약만 믿으면 서점이 순위를 갈아 끼운 뒤 두세 시간을
# 지난 값으로 보여 준다.
#
# 그래서 "예약이 자주 뜨기"를 기대하지 않는다. 한 번 뜬 실행이 몇 시간 동안
# 살아 있으면서 스스로 5분마다 수집한다. 예약은 이 순환을 켜는 점화 장치일
# 뿐이라, 늦게 떠도 이미 돌고 있는 순환이 그 사이를 메운다.
#
# 이렇게 해도 되는 이유는 이 리포가 공개(public)라 Actions 실행 시간이
# 무제한 무료이기 때문이다. 비공개로 바꾸면 월 2000분 한도에 걸리므로
# 그때는 이 순환을 접고 외부 크론 서비스로 옮겨야 한다.

on:
  schedule:
    # 점화용. 자주 적어 두면 GitHub이 그중 몇 번은 띄워 준다.
    - cron: "*/15 * * * *"
    # 순환이 어떤 이유로 죽어 있어도 6시간마다 한 번은 확실히 다시 켜지도록.
    - cron: "20 */6 * * *"
  workflow_dispatch:
    inputs:
      scope:
        description: "첫 수집 범위"
        required: true
        default: realtime
        type: choice
        options: [realtime, all]
      minutes:
        description: "순환 수명(분). 비우면 330분. 점화 연결을 시험할 때만 줄인다."
        required: false
        type: string

# 순환은 하나만 돈다. 새 실행이 뜨면 돌고 있던 것을 끊고 새로 시작한다 —
# 그래야 오래된 순환이 남아 겹치지 않고, 순환 수명도 계속 갱신된다.
concurrency:
  group: collect
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    # GitHub 작업 상한이 360분이다. 그 앞에서 스스로 끝내고 다음 순환을 띄운다.
    timeout-minutes: 350
    # 마지막 단계가 다음 순환을 띄우려면 actions 쓰기 권한이 있어야 한다.
    permissions:
      contents: read
      actions: write
    steps:
      # 순환이 너무 빨리 끝났을 때 곧바로 다음 것을 띄우면 분당 한 번씩 도는
      # 수가 있다. 시작 시각을 적어 두고 마지막 단계에서 간격을 맞춘다.
      - name: 시작 시각 기록
        run: date +%s > "$RUNNER_TEMP/started_at"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 5분마다 수집
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # 이 러너가 서점에서 직접 받는 곳.
          COLLECT_STORES: kyobo,yes24
          SNAPSHOT_WRITER: "1"
          # 알라딘은 해외 접속을 막아서 서울에 있는 Vercel 에게 회차마다 받아 달라고 한다.
          # 그 요청의 인증에 COLLECT_SECRET 을 쓴다(Vercel 환경변수와 같은 값).
          VERCEL_COLLECT_STORES: aladin
          COLLECT_SECRET: ${{ secrets.COLLECT_SECRET }}
          # 배포 주소. 위 알라딘 요청과 순위 대조 검사가 쓴다.
          BASE_URL: ${{ vars.DASHBOARD_BASE_URL }}
          FIRST_SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.scope || (github.event.schedule == '20 */6 * * *' && 'all' || 'realtime') }}
          RUN_MINUTES: ${{ inputs.minutes }}
        run: |
          # GitHub 은 이 블록을 `bash -e` 로 돌린다. -e 가 켜져 있으면 0 이 아닌 값을
          # 내는 명령 하나가 순환을 통째로 끝낸다. 실제로 순위 검사가 "값이 묵었다"(3)를
          # 낼 때마다 순환이 한 시간 만에 죽고 있었다 — 맨 위 제1 규칙과 정면으로
          # 어긋나므로 끈다.
          set +e
          set -uo pipefail

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "SUPABASE_URL 과 SUPABASE_SERVICE_ROLE_KEY 시크릿을 설정해야 합니다." >&2
            exit 1
          fi

          # 350분 상한 안에서 끝내고 다음 점화에 넘긴다.
          # 기본 330분. 점화 연결을 시험할 때만 workflow_dispatch 로 줄여 부른다.
          LIFE_MINUTES="${RUN_MINUTES:-}"
          case "$LIFE_MINUTES" in ''|*[!0-9]*|0) LIFE_MINUTES=330 ;; esac
          [ "$LIFE_MINUTES" -gt 350 ] && LIFE_MINUTES=330
          DEADLINE=$(( $(date +%s) + LIFE_MINUTES * 60 ))

          # 순환 중에 모인 문제. 수집기가 마감 때 적고, 끝에서 한 번에 빨갛게 낸다.
          PROBLEMS="$RUNNER_TEMP/problems"
          : > "$PROBLEMS"

          echo "순환 시작 — $(date -u -d "@$DEADLINE" +%H:%MZ) 까지"

          # 수집기는 마감까지 한 프로세스로 산다. 메모리를 이어 써야 회차마다
          # Supabase 에서 목록 전체를 다시 읽지 않는다(scripts/collector.js 맨 위).
          # 마감 전에 죽으면 다시 띄운다 — 마감까지 수집이 비지 않게. 정상 마감은 0 이다.
          scope="$FIRST_SCOPE"
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            node scripts/collector.js --until "$DEADLINE" --first-scope "$scope" --problems "$PROBLEMS"
            code=$?
            [ "$code" -eq 0 ] && break

            echo "수집기가 ${code}(으)로 끝났다. 30초 뒤 다시 띄운다." >&2
            echo "수집기가 마감 전에 ${code}(으)로 죽은 적이 있다." >> "$PROBLEMS"
            scope="realtime"
            sleep 30
          done

          echo "순환 종료 $(date -u +%H:%M:%SZ) — 다음 예약이 다시 켠다"

          # 빨간 표시는 "수집이 멈췄다"가 아니라 "돌긴 돌았는데 볼 것이 있다"는
          # 뜻이다 — 다음 점화는 이 결과와 무관하게 예정대로 뜬다.
          if [ -s "$PROBLEMS" ]; then
            sort -u "$PROBLEMS" >&2
            exit 1
          fi

      # 다음 순환을 스스로 띄운다.
      #
      # 예약만 믿을 수 없어서다. 이 리포에서 실제로 세어 보니 `*/15`(하루 96회)가
      # 하루 9.7회만 떴고, 가장 크게 벌어진 간격이 471분이었다. 한 순환이 330분을
      # 사는데 점화가 471분 만에 오면 그 사이 두 시간 넘게 아무도 모으지 않는다.
      # 화면에는 "실시간 5분"이라고 적혀 있는데 실제로는 두 시간이 비는 것이다.
      #
      # GITHUB_TOKEN 으로 띄운 이벤트는 보통 새 실행을 만들지 않지만,
      # workflow_dispatch 와 repository_dispatch 는 그 규칙의 예외다.
      #
      # 취소됐을 때는 띄우지 않는다. 취소는 곧 새 실행이 이미 올라왔다는 뜻이라,
      # 여기서 또 띄우면 서로 취소하며 주고받는다.
      - name: 다음 순환 점화
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail

          # 무슨 이유로든 순환이 일찍 끝났으면, 다음 것을 띄우기 전에 그만큼
          # 기다린다. 실패가 반복돼도 10분에 한 번을 넘지 않는다.
          MIN_RUN_SECONDS=600
          started=$(cat "$RUNNER_TEMP/started_at" 2>/dev/null || echo 0)
          elapsed=$(( $(date +%s) - started ))

          if [ "$started" -gt 0 ] && [ "$elapsed" -lt "$MIN_RUN_SECONDS" ]; then
            wait_for=$(( MIN_RUN_SECONDS - elapsed ))
            echo "순환이 ${elapsed}초 만에 끝났다. ${wait_for}초 기다렸다 다음을 띄운다."
            sleep "$wait_for"
          fi

          gh workflow run collect.yml --ref "${{ github.ref_name }}" -f scope=realtime \
            && echo "다음 순환을 띄웠다." \
            || echo "다음 순환을 띄우지 못했다. 예약이 대신 켠다." >&2
