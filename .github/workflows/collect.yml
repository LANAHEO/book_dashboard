name: 순위 수집

# Vercel Hobby 플랜은 크론이 하루 1회로 제한돼, 매시 표현식은 배포 자체가 실패한다.
# 그래서 스케줄을 GitHub Actions가 들고 Vercel의 /api/collect를 불러 준다.
#
# 그런데 GitHub 무료 예약은 적어 둔 시각을 지키지 않는다. `*/15`(하루 96회)로 두고
# 11일치 실행 기록을 세어 보니 실제로는 하루 9.7회, 실행 간격 중앙값 133분,
# 최악 471분이었다. 예약만 믿으면 서점이 순위를 갈아 끼운 뒤 두세 시간을
# 지난 값으로 보여 준다.
#
# 그래서 "예약이 자주 뜨기"를 기대하지 않는다. 한 번 뜬 실행이 몇 시간 동안
# 살아 있으면서 스스로 10분마다 수집한다. 예약은 이 순환을 켜는 점화 장치일
# 뿐이라, 늦게 떠도 이미 돌고 있는 순환이 그 사이를 메운다.
#
# 이렇게 해도 되는 이유는 이 리포가 공개(public)라 Actions 실행 시간이
# 무제한 무료이기 때문이다. 비공개로 바꾸면 월 2000분 한도에 걸리므로
# 그때는 이 순환을 접고 외부 크론 서비스로 옮겨야 한다.

on:
  schedule:
    # 점화용. 자주 적어 두면 GitHub이 그중 몇 번은 띄워 준다.
    - cron: "*/15 * * * *"
    # 순환이 어떤 이유로 죽어 있어도 6시간마다 한 번은 확실히 다시 켜지도록.
    - cron: "20 */6 * * *"
  workflow_dispatch:
    inputs:
      scope:
        description: "첫 수집 범위"
        required: true
        default: realtime
        type: choice
        options: [realtime, all]

# 순환은 하나만 돈다. 새 실행이 뜨면 돌고 있던 것을 끊고 새로 시작한다 —
# 그래야 오래된 순환이 남아 겹치지 않고, 순환 수명도 계속 갱신된다.
concurrency:
  group: collect
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    # GitHub 작업 상한이 360분이다. 그 앞에서 스스로 끝내고 다음 점화를 기다린다.
    timeout-minutes: 350
    steps:
      # 검사기를 쓰려면 리포가 있어야 한다. 수집 자체는 curl 한 줄이라 필요 없지만,
      # 순위가 서점과 어긋나는 일이 세 번 반복됐고 세 번 다 원인이 달랐다 —
      # 사람이 눈으로 보고 알아채기를 기다리지 않는다.
      - uses: actions/checkout@v4

      - name: 10분마다 수집
        env:
          BASE_URL: ${{ vars.DASHBOARD_BASE_URL }}
          COLLECT_SECRET: ${{ secrets.COLLECT_SECRET }}
          FIRST_SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.scope || (github.event.schedule == '20 */6 * * *' && 'all' || 'realtime') }}
        run: |
          set -uo pipefail

          if [ -z "${BASE_URL:-}" ] || [ -z "${COLLECT_SECRET:-}" ]; then
            echo "DASHBOARD_BASE_URL 변수와 COLLECT_SECRET 시크릿을 설정해야 합니다." >&2
            exit 1
          fi

          # 목표는 "서점이 밝힌 집계 기준"과 "우리가 가져온 시각"의 차이를 5분
          # 안에 두는 것이다. 교보 실시간은 매시 정각에 새 기준을 올리므로
          # 정각 직후에 들여다봐야 한다. 그래서 그냥 5분을 자는 게 아니라
          # 시계의 5분 경계에 맞춰 깨운다 — :01 :06 :11 … 에 들어가면 정각에
          # 갈린 순위를 1분 안에 잡는다. 예전에는 10분을 그냥 자서, 루프가
          # 언제 시작됐는지에 따라 차이가 최대 10분까지 벌어졌다.
          #
          # 이 값을 바꾸면 server.js 의 COLLECT_INTERVAL_MINUTES 도 같이 바꾼다.
          # 화면 위쪽 수집 시각 옆의 "우리 수집 주기" 안내가 그 값을 그대로 읽는다.
          INTERVAL=300
          # 정각 직후를 노리는 오프셋. 0으로 두면 서점이 갈아 끼우는 순간과
          # 겹쳐 이전 기준을 받을 수 있다.
          OFFSET=60
          # 350분 상한 안에서 끝내고 다음 점화에 넘긴다.
          DEADLINE=$(( $(date +%s) + 330 * 60 ))
          # 일간·주간·월간까지 훑는 전수 수집은 6시간에 한 번이면 된다.
          LAST_ALL_HOUR=""
          # 순위 대조 검사는 서점 페이지를 여러 장 여는 일이라 한 시간에 한 번.
          LAST_CHECK_HOUR=""

          collect () {
            scope="$1"
            code=$(curl -sS -o /tmp/collect.json -w "%{http_code}" \
              --max-time 600 \
              -H "Authorization: Bearer $COLLECT_SECRET" \
              "$BASE_URL/api/collect?scope=$scope" || echo "000")

            printf '%s  scope=%-8s HTTP %s  ' "$(date -u +%H:%M:%SZ)" "$scope" "$code"
            head -c 400 /tmp/collect.json 2>/dev/null
            echo

            # 한 번 실패했다고 순환을 끝내지 않는다. 서점이나 배포가 잠깐
            # 흔들린 것일 수 있고, 여기서 죽으면 다음 점화까지 몇 시간이 빈다.
            [ "$code" = "200" ]
          }

          echo "순환 시작 — ${INTERVAL}초 간격, $(date -u -d "@$DEADLINE" +%H:%MZ) 까지"

          scope="$FIRST_SCOPE"
          fail_streak=0

          while :; do
            hour=$(date -u +%H)

            # 00·06·12·18시(UTC)에 한 번은 전수로. 같은 시간에 두 번 돌지 않는다.
            case "$hour" in
              00|06|12|18)
                if [ "$LAST_ALL_HOUR" != "$hour" ]; then
                  scope="all"
                  LAST_ALL_HOUR="$hour"
                fi
                ;;
            esac

            if collect "$scope"; then
              fail_streak=0
            else
              fail_streak=$(( fail_streak + 1 ))
              echo "  실패 ${fail_streak}회째"
              # 연속으로 계속 실패하면 설정이 깨진 것이다. 조용히 도는 것보다
              # 빨간 표시를 내는 편이 낫다 — 지난번에 100번 조용히 실패했다.
              if [ "$fail_streak" -ge 5 ]; then
                echo "5회 연속 실패. 순환을 멈춘다." >&2
                exit 1
              fi
            fi

            # 수집이 "됐다"와 "맞다"는 다르다. 저장이 조용히 실패했을 때도,
            # 카드가 엉뚱한 분야 순위를 골랐을 때도 수집은 성공이라고 답했다.
            # 그래서 한 시간에 한 번은 서점 페이지를 직접 열어 대조한다.
            # 고정 목록(주간·일간·분야)이 어긋나면 그건 버그이므로 순환을 멈춘다.
            if [ "$LAST_CHECK_HOUR" != "$hour" ]; then
              LAST_CHECK_HOUR="$hour"
              echo "--- 순위 대조 검사"
              if node scripts/check-ranks.js --base "$BASE_URL" --books 4; then
                echo "--- 검사 통과"
              else
                echo "고정 목록이 서점과 어긋난다. 순환을 멈춘다." >&2
                exit 1
              fi
            fi

            scope="realtime"

            now=$(date +%s)
            [ "$now" -ge "$DEADLINE" ] && break

            # 다음 5분 경계 + OFFSET 까지 잔다. 수집이 오래 걸려 경계를 이미
            # 지났으면 그다음 경계로 넘어간다 — 그래서 아무리 밀려도 폴링
            # 시각이 :01 :06 :11 … 에서 벗어나지 않는다.
            next=$(( (now / INTERVAL + 1) * INTERVAL + OFFSET ))
            while [ "$next" -le "$now" ]; do
              next=$(( next + INTERVAL ))
            done
            [ "$next" -ge "$DEADLINE" ] && break
            sleep $(( next - now ))
          done

          echo "순환 종료 $(date -u +%H:%M:%SZ) — 다음 예약이 다시 켠다"
