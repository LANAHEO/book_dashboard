name: 순위 수집

# Vercel Hobby 플랜은 크론이 하루 1회로 제한돼, 매시 표현식은 배포 자체가 실패한다.
# 그래서 스케줄을 GitHub Actions가 들고 Vercel의 /api/collect를 불러 준다.
# Pro 플랜이면 vercel.json의 crons가 같은 일을 하므로 이 워크플로는 지워도 된다.

on:
  schedule:
    # 서점마다 순위를 갈아 끼우는 시각이 다르다 — 같은 순간에 교보는 11:00 기준,
    # 예스24는 10:00 기준을 내주고 알라딘은 기준을 밝히지 않는다. 그래서 "정시 몇 분"을
    # 우리가 못 박으면 어느 한 곳과는 반드시 어긋나고, 한 시간에 한 번이면 서점이
    # 바뀐 뒤 최대 한 시간을 뒤처진 값으로 보여 준다.
    #
    # 대신 15분마다 들여다본다. /api/collect 는 종합 실시간 3개만 먼저 확인해서
    # 지난번과 같으면 그대로 끝내므로(요청 3건), 대부분의 실행은 서점에 거의
    # 부담을 주지 않는다. 실제로 순위가 바뀐 실행만 나머지 56개를 돌린다.
    #
    # GitHub Actions 크론은 몇 분씩 늦게 뜨는 일이 잦다. 15분 간격은 그 흔들림까지
    # 감안한 값이다 — 한 번 밀려도 다음 차례가 곧 온다.
    - cron: "*/15 * * * *"
    # 일간·주간 목록은 6시간마다 한 번 전수로.
    - cron: "20 */6 * * *"
  workflow_dispatch:
    inputs:
      scope:
        description: "수집 범위"
        required: true
        default: realtime
        type: choice
        options: [realtime, all]

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 수집 호출
        env:
          BASE_URL: ${{ vars.DASHBOARD_BASE_URL }}
          COLLECT_SECRET: ${{ secrets.COLLECT_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${BASE_URL:-}" ] || [ -z "${COLLECT_SECRET:-}" ]; then
            echo "DASHBOARD_BASE_URL 변수와 COLLECT_SECRET 시크릿을 설정해야 합니다." >&2
            exit 1
          fi

          # 6시간 크론과 매시 크론이 같은 시간에 겹칠 수 있으므로, 전수 스케줄이면
          # 그것을 우선한다. 수동 실행은 입력값을 따른다.
          SCOPE="realtime"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SCOPE="${{ inputs.scope }}"
          elif [ "${{ github.event.schedule }}" = "20 */6 * * *" ]; then
            SCOPE="all"
          fi
          echo "scope=$SCOPE"

          # 응답 본문은 남기고 실패는 종료 코드로 드러낸다.
          code=$(curl -sS -o /tmp/collect.json -w "%{http_code}" \
            --max-time 600 \
            -H "Authorization: Bearer $COLLECT_SECRET" \
            "$BASE_URL/api/collect?scope=$SCOPE")

          echo "HTTP $code"
          cat /tmp/collect.json
          echo

          if [ "$code" != "200" ]; then
            echo "수집이 실패했습니다." >&2
            exit 1
          fi
