<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>도서 순위 대시보드</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="background-glow background-glow-a"></div>
    <div class="background-glow background-glow-b"></div>

    <div class="shell">
      <header class="masthead">
        <div class="masthead-copy">
          <p class="eyebrow">Book Ranking Monitor</p>
          <div class="masthead-title-line">
            <h1>교보문고 · 예스24 · 알라딘 도서 순위 대시보드</h1>
            <div class="update-badge" id="auto-refresh-badge" data-badge-state="idle" aria-live="polite">
              <span class="update-badge-orbit" aria-hidden="true"></span>
              <span class="update-badge-label" id="auto-refresh-text">자동 갱신 준비 중</span>
            </div>
          </div>
          <p class="masthead-note">
            전체 실시간 순위를 먼저 보고, 예스24와 알라딘의 분야별 실시간 순위와 주력 도서 순위를 이어서 확인합니다.
          </p>
        </div>
        <div class="masthead-status">
          <div class="status-card">
            <span class="status-label">최근 업데이트 시간</span>
            <strong id="generated-at">불러오는 중...</strong>
          </div>
        </div>
      </header>

      <section class="toolbar">
        <label class="search-box" for="search-input">
          <span>제목, 저자, 출판사 검색</span>
          <input
            id="search-input"
            type="search"
            placeholder="도서를 검색합니다."
            autocomplete="off"
          >
        </label>
        <div class="store-filter-group" id="store-filters" aria-label="Store filters"></div>
      </section>

      <section class="summary-strip" id="summary-strip">
        <span id="summary-text">데이터를 준비하고 있습니다.</span>
      </section>

      <section class="publisher-alerts" id="publisher-alerts" aria-live="polite" hidden></section>

      <main id="dashboard" class="dashboard" aria-live="polite"></main>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
