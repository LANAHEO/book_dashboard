<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#18382b">
    <meta name="color-scheme" content="light">
    <title>도서 순위 대시보드</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="background-glow background-glow-a"></div>
    <div class="background-glow background-glow-b"></div>

    <div class="shell">
      <header class="masthead">
        <div class="masthead-copy">
          <div class="brand-line">
            <span class="brand-mark" aria-hidden="true">B</span>
            <p class="eyebrow">Book Radar</p>
          </div>
          <div class="masthead-title-line">
            <h1>도서 순위 대시보드</h1>
            <div class="update-badge" id="auto-refresh-badge" data-badge-state="idle" aria-live="polite">
              <span class="update-badge-orbit" aria-hidden="true"></span>
              <span class="update-badge-label" id="auto-refresh-text">자동 갱신 준비 중</span>
            </div>
          </div>
          <p class="masthead-note">
            아래 탭으로 상상스퀘어 도서 순위와 세 서점의 실시간·분야별·일간·주간 순위를 바꿔가며 봅니다.
          </p>
        </div>
        <div class="masthead-status">
          <span class="status-label">마지막 수집</span>
          <strong id="generated-at">불러오는 중...</strong>
          <span class="status-hint">서점별 수집 시점은 아래 표에 있습니다</span>
        </div>
      </header>

      <section class="collect-status" id="collect-status" aria-label="서점별 데이터 수집 시점"></section>

      <nav class="view-nav" aria-label="대시보드 화면 선택">
        <button type="button" data-view="focus" aria-current="true">상상스퀘어</button>
        <button type="button" data-view="realtime">실시간</button>
        <button type="button" data-view="category">분야별</button>
        <button type="button" data-view="daily">일간</button>
        <button type="button" data-view="weekly">주간</button>
      </nav>

      <section class="toolbar" aria-label="대시보드 필터">
        <label class="search-box" for="search-input">
          <span>제목, 저자, 출판사 검색</span>
          <input
            id="search-input"
            type="search"
            placeholder="도서를 검색합니다."
            autocomplete="off"
          >
        </label>
        <div class="store-filter-group" id="store-filters" aria-label="Store filters"></div>
      </section>

      <section class="summary-strip" id="summary-strip">
        <span id="summary-text">데이터를 준비하고 있습니다.</span>
      </section>

      <main id="dashboard" class="dashboard" aria-live="polite"></main>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
